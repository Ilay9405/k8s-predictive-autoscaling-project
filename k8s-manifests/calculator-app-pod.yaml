apiVersion: v1
kind: Pod
metadata:
  name: calculator-app
  namespace: default
  labels:
    app: calculator-app
spec:
  containers:
    - name: calculator-app
      image: ghcr.io/ilay9405/k8s-predictive-autoscaling-project-calculator-app:3a1d48489cb4576a23a62a6658b2b6016832715e
      imagePullPolicy: Always
      command: ["sleep", "infinity"]   # keeps the pod alive so it shows up in the cluster
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
