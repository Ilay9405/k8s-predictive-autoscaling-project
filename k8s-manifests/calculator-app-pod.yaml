apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
  namespace: default
  labels:
    app: calculator-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-app
  template:
    metadata:
      labels:
        app: calculator-app
    spec:
      containers:
        - name: calculator-app
          image: ghcr.io/ilay9405/k8s-predictive-autoscaling-project-calculator-app:12a831c32a2cbab6d4cd6c276628e338fe083391
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-app
  namespace: default
  labels:
    app: calculator-app
spec:
  type: NodePort
  selector:
    app: calculator-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
