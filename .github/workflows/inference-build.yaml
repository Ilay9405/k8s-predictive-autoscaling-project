name: Build and Deploy Inference server

on:
  push:
    branches:
      - main
    paths:
      - "inference/**"

permissions:
  packages: write
  contents: write   # needed to commit the manifest tag update back to Git

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token that can push back to the repo (PAT stored as secret)
          # Falls back to GITHUB_TOKEN for read — write needs explicit token for protected branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin the image tag to the exact git SHA so ArgoCD can detect real changes.
      # Mutable tags like :main never change from ArgoCD's perspective, so it never redeploys.
      - name: Set image tag
        id: tag
        run: echo "tag=ghcr.io/${{ github.repository }}-inference:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./inference/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tag }}

      # Update the manifest with the new SHA tag and commit it back to Git.
      # ArgoCD watches Git — when it sees this commit, it will diff the image tag
      # and trigger a rolling update on the inference deployment automatically.
      - name: Update manifest image tag
        run: |
          sed -i "s|ghcr.io/${{ github.repository }}-inference:.*|${{ steps.tag.outputs.tag }}|g" k8s-manifests/predscale.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/predscale.yaml
          git diff --staged --quiet || git commit -m "ci: update inference image to ${{ github.sha }}"
          git push
