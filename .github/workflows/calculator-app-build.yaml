name: Build and Push Calculator App

on:
  push:
    branches:
      - calculator-app-pod
    paths:
      - "calculator-app/**"
      - ".github/workflows/calculator-app-build.yaml"

permissions:
  packages: write
  contents: write   # needed to commit the manifest tag update back to Git

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        working-directory: calculator-app
        run: mvn test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin the image tag to the exact git SHA so ArgoCD can detect real changes.
      - name: Set image tag
        id: tag
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO}-calculator-app:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./calculator-app
          file: ./calculator-app/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tag }}

      # Keep the pod manifest pointing at the exact SHA so any change triggers a pod replacement.
      - name: Update pod manifest image tag
        run: |
          sed -i "s|image: .*calculator-app:.*|image: ${{ steps.tag.outputs.tag }}|g" k8s-manifests/calculator-app-pod.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/calculator-app-pod.yaml
          git diff --staged --quiet || git commit -m "ci: update calculator-app image to ${{ github.sha }}"
          git push
