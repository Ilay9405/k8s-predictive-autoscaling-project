name: Build and Push Calculator App

on:
  push:
    branches:
      - calculator-app-pod
    paths:
      - "calculator-app/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        working-directory: calculator-app
        run: mvn test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag with both the exact git SHA (for ArgoCD immutability) and :latest
      - name: Set image tag
        id: tag
        run: |
          echo "sha_tag=${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest_tag=${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./calculator-app
          file: ./calculator-app/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.sha_tag }}
            ${{ steps.tag.outputs.latest_tag }}

      # Keep the pod manifest pointing at the exact SHA so the cluster always
      # pulls the right version and any change triggers a pod replacement.
      - name: Update pod manifest image tag
        run: |
          sed -i "s|image: .*calculator-app:.*|image: ${{ steps.tag.outputs.sha_tag }}|g" k8s-manifests/calculator-app-pod.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/calculator-app-pod.yaml
          git diff --staged --quiet || git commit -m "ci: update calculator-app image to ${{ github.sha }}"
          git push
