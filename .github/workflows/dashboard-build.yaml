name: Build and Deploy Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"

permissions:
  packages: write
  contents: write   # needed to commit the manifest tag update back to Git

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA-pinned tag — ArgoCD can detect this changed in Git and redeploy
      - name: Set image tag
        id: tag
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO}-dashboard:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tag }}

      # Patch the dashboard manifest with the new SHA tag and push back to Git.
      # ArgoCD detects the commit, diffs the image field, and rolls out the new pod.
      - name: Update manifest image tag
        run: |
          sed -i "s|ghcr.io/${{ steps.tag.outputs.repo }}-dashboard:.*|${{ steps.tag.outputs.tag }}|g" k8s-manifests/dashboard.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/dashboard.yaml
          git diff --staged --quiet || git commit -m "ci: update dashboard image to ${{ github.sha }}"
          git push
